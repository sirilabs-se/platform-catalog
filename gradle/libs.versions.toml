
# platform-catalog — Gradle Version Catalog
#
# Single source of truth for dependency and toolchain versions across every
# platform artifact (platform-build, platform-core, platform-testing,
# application-template) and every consuming application.
#
# Enterprise Application Platform Strategy v7, Section 4.
#
# Rule: no other repo pins a raw version string for a shared dependency.
# Every version referenced anywhere else in the platform must trace back
# to an alias defined here.

[versions]

# --- Toolchain -----------------------------------------------------------
java = "25"
gradle = "9.6.0"

# --- Frameworks ------------------------------------------------------------
spring-boot = "4.1.0"
micrometer = "1.17.0"

# --- Test frameworks ---------------------------------------------------
junit = "6.0.3"
assertj = "3.27.7"
mockito = "5.23.0"
archunit = "1.4.1"

# --- Code quality / formatting ------------------------------------------
spotless = "7.2.1"
google-java-format = "1.36.1"

# --- Compatibility checking ----------------------------------------------
japicmp = "0.4.6"

[libraries]

# --- Spring Boot (BOM) ----------------------------------------------------
spring-boot-dependencies = { group = "org.springframework.boot", name = "spring-boot-dependencies", version.ref = "spring-boot" }

# --- Micrometer -----------------------------------------------------------
micrometer-core = { group = "io.micrometer", name = "micrometer-core", version.ref = "micrometer" }
micrometer-registry-prometheus = { group = "io.micrometer", name = "micrometer-registry-prometheus", version.ref = "micrometer" }

# --- JUnit 5 ---------------------------------------------------------------
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version = "1.13.3" }

# --- AssertJ ----------------------------------------------------------------
assertj-core = { group = "org.assertj", name = "assertj-core", version.ref = "assertj" }

# --- Mockito ------------------------------------------------------------
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { group = "org.mockito", name = "mockito-junit-jupiter", version.ref = "mockito" }

# --- ArchUnit -----------------------------------------------------------
archunit-junit5 = { group = "com.tngtech.archunit", name = "archunit-junit5", version.ref = "archunit" }

# --- Formatting ------------------------------------------------------------
google-java-format = { group = "com.google.googlejavaformat", name = "google-java-format", version.ref = "google-java-format" }

[plugins]

spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
japicmp = { id = "me.champeau.gradle.japicmp", version.ref = "japicmp" }

[bundles]

# Convenience bundle for JVM test suites (JUnit 5 + AssertJ + Mockito)
unit-test = ["junit-jupiter", "assertj-core", "mockito-core", "mockito-junit-jupiter"]
